# Compile le mod et publie une "Release" GitHub à chaque envoi de code.
# Le mod installé chez les joueurs vérifie cette page au lancement et se met à jour tout seul (voir AutoUpdater).
name: Release

on:
  push:
    branches:
      - claude/trusting-edison-z1avyc
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historique et tags complets : nécessaires au journal des changements

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Numéro de version
        id: version
        run: echo "version=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Journal des changements
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "Version ${{ steps.version.outputs.version }} (commit ${{ github.sha }})."
            echo
            if [ -n "$PREV" ]; then
              echo "## Changements depuis $PREV"
              RANGE="$PREV..HEAD"
            else
              echo "## Changements"
              RANGE="HEAD"
            fi
            echo
            git log "$RANGE" --no-merges --pretty='- %s' | head -n 60
            echo
            echo "Comparaison complète : https://github.com/${{ github.repository }}/compare/${PREV:-HEAD}...${{ github.sha }}"
          } > changelog.md
          cat changelog.md

      - name: Compilation
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }} --no-daemon

      - name: Publication de la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Mode Minecraft ${{ steps.version.outputs.version }}
          body_path: changelog.md
          files: build/libs/modeminecraft-${{ steps.version.outputs.version }}.jar
          make_latest: true
